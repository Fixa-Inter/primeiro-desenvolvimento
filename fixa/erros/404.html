<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erro 404 - FIXA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/fixa/assets/logo-escuro.svg">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="cabecalho">
        <a href="/index.html">
            <img
                class="logo"
                src="/fixa/assets/logo1.svg"
                alt="FIXA - Página inicial"
            >
        </a>
    </header>

    <main class="conteudo">
        <section class="informacoes">
            <span class="etiqueta">Erro 404</span>

            <p class="numero-erro">404</p>

            <h1>Não encontramos esta página</h1>

            <p class="descricao">
                O endereço pode estar errado ou a página mudou de lugar.
                Confira o link ou volte para o início.
            </p>

            <div class="botoes">
                <a class="botao botao-azul" href="/index.html">
                    Voltar ao início
                </a>

                <button
                    class="botao botao-branco"
                    type="button"
                    onclick="history.back()"
                >
                    Voltar à página anterior
                </button>
            </div>

            <p class="suporte">
                Se continuar acontecendo, fale com o suporte
                e informe o código 404.
            </p>
        </section>

        <div class="circulo">
            <img
                class="mascote"
                src="/fixa/assets/manu-lupa.svg"
                alt="Manu segurando uma lupa"
            >
        </div>
    </main>
</body>
</html>
