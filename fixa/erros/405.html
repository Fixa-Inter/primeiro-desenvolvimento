<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erro 405 - FIXA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/fixa/assets/logo-escuro.svg">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="cabecalho">
        <a href="/index.html">
            <img
                class="logo"
                src="/fixa/assets/logo1.svg"
                alt="FIXA - Página inicial"
            >
        </a>
    </header>

    <main class="conteudo">
        <section class="informacoes">
            <span class="etiqueta">Erro 405</span>

            <p class="numero-erro">405</p>

            <h1>Não dá para fazer isso por aqui</h1>

            <p class="descricao">
                Essa ação não funciona nesta página. Volte e tente de novo
                pelo caminho indicado na tela.
            </p>

            <div class="botoes">
                <button
                    class="botao botao-azul"
                    type="button"
                    onclick="history.back()"
                >
                    Voltar à página anterior
                </button>

                <a class="botao botao-branco" href="/index.html">
                    Voltar ao início
                </a>
            </div>

            <p class="suporte">
                Se continuar acontecendo, fale com o suporte
                e informe o código 405.
            </p>
        </section>

        <div class="circulo">
            <img
                class="mascote"
                src="/fixa/assets/manu-voltar.svg"
                alt="Manu segurando uma placa com uma seta de voltar"
            >
        </div>
    </main>
</body>
</html>
