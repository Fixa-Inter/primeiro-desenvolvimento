<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erro 401 - FIXA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/fixa/assets/logo-escuro.svg">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="cabecalho">
        <a href="index.html">
            <img
                class="logo"
                src="/fixa/assets/logo1.svg"
                alt="FIXA - Página inicial"
            >
        </a>
    </header>

    <main class="conteudo">
        <section class="informacoes">
            <span class="etiqueta">Erro 401</span>

            <p class="numero-erro">401</p>

            <h1>Você precisa entrar na sua conta</h1>

            <p class="descricao">
                Sua sessão terminou ou o login ainda não foi feito.
                Entre de novo para continuar de onde parou.
            </p>

            <div class="botoes">
                <a class="botao botao-azul" href="/fixa/comofunciona.html">
                    Entrar na conta
                </a>

                <a class="botao botao-branco" href="/index.html">
                    Voltar ao início
                </a>
            </div>

            <p class="suporte">
                Se continuar acontecendo, fale com o suporte
                e informe o código 401.
            </p>
        </section>

        <div class="circulo">
            <img
                class="mascote"
                src="/fixa/assets/manu-chave.svg"
                alt="Manu sorrindo e segurando uma chave"
            >
        </div>
    </main>
</body>
</html>
