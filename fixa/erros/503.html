<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Erro 503 - FIXA</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/fixa/assets/logo-escuro.svg">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="cabecalho">
        <a href="/index.html">
            <img
                class="logo"
                src="/fixa/assets/logo1.svg"
                alt="FIXA - Página inicial"
            >
        </a>
    </header>

    <main class="conteudo">
        <section class="informacoes">
            <span class="etiqueta">Erro 503</span>

            <p class="numero-erro">503</p>

            <h1>Estamos em manutenção</h1>

            <p class="descricao">
                O Fixa está passando por ajustes ou com muitos acessos
                agora. Volte daqui a pouco, já estamos cuidando disso.
            </p>

            <div class="botoes">
                <button
                    class="botao botao-azul"
                    type="button"
                    onclick="location.reload()"
                >
                    Tentar de novo
                </button>

                <a class="botao botao-branco" href="/index.html">
                    Voltar ao início
                </a>
            </div>

            <p class="suporte">
                Se continuar acontecendo, fale com o suporte
                e informe o código 503.
            </p>
        </section>

        <div class="circulo">
            <img
                class="mascote"
                src="/fixa/assets/manu-caixa.svg"
                alt="Manu com uma caixa de ferramentas e uma chave de boca"
            >
        </div>
    </main>
</body>
</html>
