<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defina sua senha | FIXA</title>
  <link rel="icon" href="../assets/logo-claro.svg">
  <link rel="stylesheet" href="../crud/home/fontes/fontes.css">
  <link rel="stylesheet" href="cadastro.css">
  <link rel="stylesheet" href="../crud/home/senha.css">
  <script src="../crud/home/JavaScript/senha.js" defer></script>
</head>
<body>
  <main class="cadastro">
    <a class="sair-cadastro" href="../../index.html" aria-label="Voltar ao site">×</a>

    <div class="etapas-cadastro" aria-label="Etapas: instituição, código, senha e endereço">
      <span class="etapa concluida">1</span>
      <span class="linha-etapa concluida" aria-hidden="true"></span>
      <span class="etapa concluida">2</span>
      <span class="linha-etapa concluida" aria-hidden="true"></span>
      <span class="etapa atual" aria-current="step">3</span>
      <span class="linha-etapa" aria-hidden="true"></span>
      <span class="etapa">4</span>
    </div>

    <h1>Defina sua senha</h1>
    <p class="descricao-cadastro">Escolha a senha definitiva de acesso ao Fixa.</p>

    <form action="cadastro-endereco-info.html" method="post">
      <div class="campo-cadastro">
        <label for="senha">Nova senha *</label>
        <div class="campo-senha">
          <input type="password" id="senha" name="senha" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="Use pelo menos 8 caracteres, uma letra e um número." autocomplete="new-password" aria-describedby="regras-senha" placeholder="Digite sua nova senha" required>
          <button class="mostrar-senha" type="button" data-campo="senha" aria-controls="senha" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="risco-senha" d="m3 3 18 18"></path>
            </svg>
          </button>
        </div>
      </div>

      <ul class="regras-senha" id="regras-senha">
        <li>Mínimo de 8 caracteres</li>
        <li>Pelo menos uma letra</li>
        <li>Pelo menos um número</li>
      </ul>

      <div class="campo-cadastro">
        <label for="confirmarSenha">Confirmar nova senha *</label>
        <div class="campo-senha">
          <input type="password" id="confirmarSenha" name="confirmarSenha" minlength="8" autocomplete="new-password" placeholder="Repita a nova senha" required>
          <button class="mostrar-senha" type="button" data-campo="confirmarSenha" aria-controls="confirmarSenha" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="risco-senha" d="m3 3 18 18"></path>
            </svg>
          </button>
        </div>
      </div>

      <a class="botao-principal" href="cadastro-endereco-info.html">Continuar</a>
    </form>

    <a class="voltar-cadastro" href="cadastro-codigo.html">Voltar</a>
  </main>
</body>
</html>
