<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre sua instituição | FIXA</title>
  <link rel="icon" href="../assets/logo-claro.svg">
  <link rel="stylesheet" href="../crud/home/fontes/fontes.css">
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <main class="cadastro">
    <a class="sair-cadastro" href="../../index.html" aria-label="Voltar ao site">×</a>

    <div class="etapas-cadastro" aria-label="Etapas: Instituição, E-mail, Senha e Endereço">
      <div class="passo-cadastro"><span class="etapa atual" aria-current="step">1</span><span class="nome-etapa">Instituição</span></div>
      <span class="linha-etapa" aria-hidden="true"></span>
      <div class="passo-cadastro"><span class="etapa">2</span><span class="nome-etapa">E-mail</span></div>
      <span class="linha-etapa" aria-hidden="true"></span>
      <div class="passo-cadastro"><span class="etapa">3</span><span class="nome-etapa">Senha</span></div>
      <span class="linha-etapa" aria-hidden="true"></span>
      <div class="passo-cadastro"><span class="etapa">4</span><span class="nome-etapa">Endereço</span></div>
    </div>

    <h1>Cadastre sua instituição</h1>
    <p class="descricao-cadastro">Leva menos de 2 minutos. Depois enviaremos um código de verificação para o e-mail corporativo informado.</p>

    <form novalidate action="cadastro-codigo.html" method="post">
      <div class="campo-cadastro">
        <label for="nome">Nome da instituição *</label>
        <input type="text" id="nome" name="nome" autocomplete="organization" placeholder="Ex: Instituto J&amp;F - Escola de Tecnologia">
      </div>

      <div class="campo-cadastro">
        <label for="tipo_instituicao">Tipo da instituição *</label>
        <select id="tipo_instituicao" name="tipo_instituicao">
          <option value="">Selecione o tipo</option>
          <option value="1">Escola</option>
          <option value="2">Faculdade</option>
          <option value="3">Empresa</option>
          <option value="4">Órgão Público</option>
        </select>
      </div>

      <div class="campo-cadastro">
        <label for="email_corporativo">E-mail corporativo *</label>
        <input type="email" id="email_corporativo" name="email_corporativo" autocomplete="email" placeholder="Ex: contato@suainstituicao.com.br">
      </div>

      <a class="botao-principal" href="cadastro-codigo.html">Continuar</a>
    </form>

    <p class="link-cadastro">Já é cadastrado? <a href="../crud/login/login.html">Entrar</a></p>
    <a class="voltar-cadastro" href="cadastro-escolha.html">Voltar</a>
  </main>
</body>
</html>
