<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastre sua instituição | FIXA</title>
  <link rel="icon" href="../assets/logo-claro.svg">
  <link rel="stylesheet" href="../crud/home/fontes/fontes.css">
  <link rel="stylesheet" href="cadastro.css">
  <script src="cadastro.js" defer></script>
</head>
<body>
  <main class="cadastro">
    <a class="sair-cadastro" href="../../index.html" aria-label="Voltar ao site">×</a>

    <div class="etapas-cadastro" aria-label="Etapas: instituição, código, senha e endereço">
      <span class="etapa atual" aria-current="step">1</span>
      <span class="linha-etapa" aria-hidden="true"></span>
      <span class="etapa">2</span>
      <span class="linha-etapa" aria-hidden="true"></span>
      <span class="etapa">3</span>
      <span class="linha-etapa" aria-hidden="true"></span>
      <span class="etapa">4</span>
    </div>

    <h1>Cadastre sua instituição</h1>
    <p class="descricao-cadastro">Leva menos de 2 minutos. Depois enviaremos um código de verificação para o e-mail corporativo informado.</p>

    <form action="cadastro-codigo.html" method="post">
      <div class="campo-cadastro">
        <label for="nome">Nome da instituição *</label>
        <input type="text" id="nome" name="nome" maxlength="50" autocomplete="organization" placeholder="Ex: Instituto J&amp;F - Escola de Tecnologia" required>
      </div>

      <div class="campo-cadastro">
        <label for="tipo_instituicao">Tipo da instituição *</label>
        <select id="tipo_instituicao" name="tipo_instituicao" required>
          <option value="">Selecione o tipo</option>
          <option value="escola-tecnica">Escola técnica</option>
          <option value="ensino-medio">Escola de ensino médio</option>
          <option value="faculdade-universidade">Faculdade / Universidade</option>
          <option value="formacao-profissional">Centro de formação profissional</option>
          <option value="outra">Outra</option>
        </select>
      </div>

      <div class="campo-cadastro">
        <label for="email_corporativo">E-mail corporativo *</label>
        <input type="email" id="email_corporativo" name="email_corporativo" maxlength="50" autocomplete="email" placeholder="Ex: contato@suainstituicao.com.br" required>
      </div>

      <button class="botao-principal" type="submit">Continuar</button>
    </form>

    <p class="link-cadastro">Já é cadastrado? <a href="../crud/login/login.html">Entrar</a></p>
    <a class="voltar-cadastro" href="cadastro-escolha.html">Voltar</a>
  </main>
</body>
</html>
