<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirme os dados da instituição | FIXA</title>
  <link rel="icon" href="../assets/logo-claro.svg">
  <link rel="stylesheet" href="../crud/home/fontes/fontes.css">
  <link rel="stylesheet" href="cadastro.css">
  <link rel="stylesheet" href="../crud/home/senha.css">
  <script src="../crud/home/JavaScript/senha.js" defer></script>
</head>
<body>
  <main class="cadastro">
    <a class="sair-cadastro" href="../../index.html" aria-label="Voltar ao site">×</a>

    <h1>Confirme seus dados de instituição</h1>
    <p class="descricao-cadastro">Informe o e-mail e a senha da instituição para adicionar um novo endereço.</p>

    <form novalidate action="cadastro-endereco-info.html" method="post">
      <div class="campo-cadastro">
        <label for="email_corporativo">E-mail da instituição *</label>
        <input type="email" id="email_corporativo" name="email_corporativo" autocomplete="username" placeholder="Ex: contato@dominio.com.br">
      </div>

      <div class="campo-cadastro">
        <label for="senha">Senha *</label>
        <div class="campo-senha">
          <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="Digite a senha da instituição">
          <button class="mostrar-senha" type="button" data-campo="senha" aria-controls="senha" aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
              <path class="risco-senha" d="m3 3 18 18"></path>
            </svg>
          </button>
        </div>
      </div>

      <a class="botao-principal" href="cadastro-endereco-info.html">Continuar</a>
    </form>

    <a class="voltar-cadastro" href="cadastro-escolha.html">Voltar</a>
  </main>
</body>
</html>
