<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicione um endereço | FIXA</title>
  <link rel="icon" href="../assets/logo-claro.svg">
  <link rel="stylesheet" href="../crud/home/fontes/fontes.css">
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>
  <main class="cadastro">
    <a class="sair-cadastro" href="../../index.html" aria-label="Voltar ao site">×</a>

    <div class="etapas-cadastro" aria-label="Etapas: Instituição, E-mail, Senha e Endereço">
      <div class="passo-cadastro"><span class="etapa concluida">1</span><span class="nome-etapa">Instituição</span></div>
      <span class="linha-etapa concluida" aria-hidden="true"></span>
      <div class="passo-cadastro"><span class="etapa concluida">2</span><span class="nome-etapa">E-mail</span></div>
      <span class="linha-etapa concluida" aria-hidden="true"></span>
      <div class="passo-cadastro"><span class="etapa concluida">3</span><span class="nome-etapa">Senha</span></div>
      <span class="linha-etapa concluida" aria-hidden="true"></span>
      <div class="passo-cadastro"><span class="etapa atual" aria-current="step">4</span><span class="nome-etapa">Endereço</span></div>
    </div>

    <h1>Adicione um endereço</h1>
    <p class="descricao-cadastro">Adicione um endereço dessa instituição. Os dados no app são separados por endereço, não por instituição.</p>

    <form novalidate action="cadastro-concluido.html" method="post">
      <div class="campo-cadastro">
        <label for="nome">Nome do endereço *</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Sede Campinas">
      </div>

      <div class="linha-campos">
        <div class="campo-cadastro">
          <label for="cnpj">CNPJ *</label>
          <input type="text" id="cnpj" name="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00">
        </div>
        <div class="campo-cadastro">
          <label for="cep">CEP *</label>
          <input type="text" id="cep" name="cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000">
        </div>
      </div>

      <div class="campo-cadastro">
        <label for="rua">Logradouro</label>
        <input type="text" id="rua" name="rua" autocomplete="address-line1" placeholder="Ex: Rua das Flores">
      </div>

      <div class="linha-campos">
        <div class="campo-cadastro">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" autocomplete="address-level3" placeholder="Ex: Centro">
        </div>
        <div class="campo-cadastro">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" autocomplete="address-level2" placeholder="Ex: São Paulo">
        </div>
      </div>

      <div class="linha-campos">
        <div class="campo-cadastro">
          <label for="estado">Estado</label>
          <input type="text" id="estado" name="estado" autocomplete="address-level1" placeholder="UF">
        </div>
        <div class="campo-cadastro">
          <label for="numero">Número *</label>
          <input type="text" id="numero" name="numero" placeholder="Ex: 120">
        </div>
        <div class="campo-cadastro">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="complemento" autocomplete="address-line2" placeholder="Opcional">
        </div>
      </div>

      <a class="botao-principal" href="cadastro-concluido.html">Concluir cadastro</a>
    </form>

    <a class="voltar-cadastro" href="cadastro-endereco-cnpj.html">Voltar</a>
  </main>
  <script src="cadastro-cnpj.js" defer></script>
</body>
</html>
