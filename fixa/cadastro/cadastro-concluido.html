<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro concluído | FIXA</title>
  <link rel="icon" href="../assets/logo-claro.svg">
  <link rel="stylesheet" href="../crud/home/fontes/fontes.css">
  <link rel="stylesheet" href="cadastro.css">
  <script src="cadastro.js" defer></script>
</head>
<body>
  <main class="cadastro">
    <a class="sair-cadastro" href="../../index.html" aria-label="Voltar ao site">×</a>

    <div class="etapas-cadastro" aria-label="Etapas: instituição, código, senha e endereço">
      <span class="etapa concluida">1</span>
      <span class="linha-etapa concluida" aria-hidden="true"></span>
      <span class="etapa concluida">2</span>
      <span class="linha-etapa concluida" aria-hidden="true"></span>
      <span class="etapa concluida">3</span>
      <span class="linha-etapa concluida" aria-hidden="true"></span>
      <span class="etapa concluida">4</span>
    </div>

    <img class="mascote-cadastro" src="manu-cadastro.svg" alt="Manu comemorando o cadastro">

    <h1>Cadastro concluído!</h1>
    <p class="descricao-cadastro">Tudo pronto. O endereço da instituição já está cadastrado.</p>

    <div class="aviso-cadastro">
      <h2>COMO ENTRAR</h2>
      <p>Nos próximos acessos, use o e-mail da instituição, a senha que você criou e o CNPJ.</p>
    </div>

    <a class="botao-principal" href="../crud/login/login.html">Entrar</a>
  </main>
</body>
</html>
